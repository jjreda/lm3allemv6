<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#1d0a06;font-family:'Trebuchet MS',system-ui,sans-serif;color:#fff3df;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer}
svg.si{width:1em;height:1em;vertical-align:-.12em}b.em{font-weight:400;font-style:normal}
#app{max-width:480px;height:100dvh;margin:auto;position:relative;overflow:hidden;background:#3b1710}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.scr.on{display:flex}
.bg{background:linear-gradient(#3b171066,#1d0a06ee),url(market.jpg) 52% 30%/cover}
.btn{background:linear-gradient(#f5b82e,#d98b12);color:#3b1710;font-weight:800;font-size:18px;padding:14px 22px;border-radius:16px;box-shadow:0 4px 0 #8a4f08;margin:6px 0}
.btn.alt{background:linear-gradient(#2aa5a0,#17706d);color:#fff;box-shadow:0 4px 0 #0c4745}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4f08}.btn:disabled{filter:grayscale(1);opacity:.5}
#title{align-items:center;justify-content:flex-end;padding-bottom:36px;text-align:center}
#title h1{font-size:52px;margin:0;color:#f5b82e;text-shadow:0 4px 0 #8a2b12,0 0 24px #ffb34799;letter-spacing:1px}
#title h2{margin:0 0 6px;font-size:30px}#title p{margin:0 0 16px;opacity:.85}#title .btn{width:240px}
.hd2{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-weight:800;font-size:20px;background:#2a0f0a}
.hd2 .btn{padding:6px 14px;font-size:15px;margin:0}
.grid{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.card{display:flex;align-items:center;gap:14px;background:#4d2016;border:2px solid #f5b82e55;border-radius:18px;padding:12px;text-align:left;width:100%;flex:none}
.card .em2{font-size:36px}.card b{font-size:17px;display:block}.card small{opacity:.8;font-size:12px}.card.lock{opacity:.45}
#hud{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#2a0f0a;font-weight:800;font-size:15px}
#hud .rep{flex:1;height:12px;background:#0006;border-radius:8px;overflow:hidden}#hud .rep i{display:block;height:100%;background:linear-gradient(90deg,#d62f2f,#f5b82e,#3fbf5f);transition:width .3s}
#hud button{background:#f5b82e;color:#3b1710;border-radius:10px;padding:4px 10px;font-weight:800}
#scene{flex:0 0 42%;position:relative;overflow:hidden;background:#4a2a5c}
#bg{position:absolute;inset:0;width:100%;height:100%}
.ln{animation:fl 2.2s ease-in-out infinite alternate}@keyframes fl{from{opacity:.5}to{opacity:1}}
.wk{position:absolute;filter:brightness(.5) saturate(.7);animation:wk linear infinite}
@keyframes wk{from{transform:translateX(-50px)}to{transform:translateX(540px)}}
#chef{position:absolute;left:50%;bottom:24%;height:56%;transform:translateX(-50%);transform-origin:50% 100%;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(0 4px 6px #0007)}
@keyframes bob{50%{transform:translateX(-50%) scaleY(1.025)}}
#chef.cheer{animation:cheer .6s}@keyframes cheer{30%{transform:translateX(-50%) translateY(-14px) rotate(-3deg)}65%{transform:translateX(-50%) rotate(3deg)}}
#chef.oops{animation:oops .5s}@keyframes oops{25%{transform:translateX(-50%) rotate(-4deg)}75%{transform:translateX(-50%) rotate(4deg)}}
#say{position:absolute;top:6px;left:8px;right:8px;background:#fff3dff2;color:#3b1710;border-radius:14px;padding:6px 10px;display:none;align-items:center;gap:8px;font-weight:800;font-size:15px;z-index:5;box-shadow:0 4px 12px #0005}
#say.on{display:flex;animation:pop .25s}#say b{font-size:26px;font-weight:400}#say small{display:block;font-size:13px;opacity:.75}
#custs{position:absolute;left:0;right:0;bottom:0;display:flex;gap:5px;padding:6px;align-items:flex-end;z-index:3}
.cust{flex:1;min-width:0;background:#3b1710e8;border:2px solid #f5b82e66;border-radius:14px;padding:3px 3px 4px;text-align:center;position:relative;transition:transform .15s}
.cust.sel{border-color:#fff;box-shadow:0 0 14px #f5b82e}.cust.in{animation:wi .5s ease-out}
.cust.talking .hd{box-shadow:0 0 0 3px #3fbf5f,0 0 14px #3fbf5f;animation:talkPulse .35s ease-in-out infinite alternate!important}
@keyframes talkPulse{from{transform:scale(1) translateY(0)}to{transform:scale(1.08) translateY(-3px)}}
@keyframes wi{from{transform:translateY(40px) scale(.6);opacity:0}}
.av{position:relative;height:52px;display:flex;justify-content:center}
.av .hd{position:absolute;top:0;width:48px;height:48px;border-radius:50%;overflow:hidden;border:2px solid #f5b82e;z-index:1;line-height:1;transform-origin:50% 90%;background:#2a0f0a;display:flex;align-items:center;justify-content:center}
.av .hd img{width:100%;height:100%;object-fit:cover;display:block}
.av .bd{position:absolute;bottom:0;width:48px;height:20px;border-radius:24px 24px 6px 6px;background:var(--c)}
.av .bd::before{content:'';position:absolute;left:50%;top:-2px;width:16px;height:8px;border-radius:0 0 12px 12px;background:#0003;transform:translateX(-50%)}
.mood{position:absolute;right:2px;top:-3px;font-style:normal;font-size:16px;z-index:2;text-shadow:0 1px 2px #000}
.cust.m1 .hd{animation:sway 1.8s ease-in-out infinite alternate}.cust.m3 .hd{animation:tilt .5s ease-in-out infinite alternate}.cust.m4 .hd{animation:shk .18s infinite}
@keyframes sway{to{transform:rotate(5deg)}}@keyframes tilt{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}@keyframes shk{50%{transform:translateX(3px)}}
.pb{height:6px;background:#0007;border-radius:5px;overflow:hidden;margin:3px 0}.pb b{display:block;height:100%;width:100%}
.rn{font-size:10px;font-weight:800;opacity:.85;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ord{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;font-size:16px}.ord .no{opacity:.7;font-size:12px}
.ghost{pointer-events:none}.ghost.gok{animation:gok .7s forwards}.ghost.gbad{animation:gbad .7s forwards}
@keyframes gok{30%{transform:translateY(-20px) scale(1.1)}to{transform:translateY(-60px) scale(.7);opacity:0}}@keyframes gbad{to{transform:translateX(90px) rotate(18deg);opacity:0}}
#work{flex:1;display:flex;flex-direction:column;padding:8px 10px;gap:6px;background:repeating-linear-gradient(45deg,#4d2016 0 14px,#46201a 14px 28px);min-height:0}
#plateRow{display:flex;align-items:center;gap:10px}#pw{position:relative;flex:none}
#plate{width:92px;height:92px;border-radius:50%;background:radial-gradient(#fff3df 55%,#d9c9a8 56%,#fff3df 62%);border:3px solid #2aa5a0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;font-size:25px;padding:8px}
#plate>span{animation:pop .25s;line-height:1}@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.steam{position:absolute;left:50%;top:-4px;width:40px;transform:translateX(-50%);pointer-events:none;display:none}.steam.on{display:block}
.steam i{position:absolute;bottom:0;width:8px;height:8px;border-radius:50%;background:#fffd;filter:blur(3px);animation:st 1.6s infinite}.steam i:nth-child(2){left:14px;animation-delay:.5s}.steam i:nth-child(3){left:28px;animation-delay:1s}
@keyframes st{from{transform:translateY(0);opacity:.8}to{transform:translateY(-28px) scale(2);opacity:0}}
#pname{flex:1;font-size:13px;font-weight:700;min-height:40px}
#ings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1;align-content:start;overflow:auto}
.lbl{grid-column:1/-1;font-size:12px;opacity:.85;margin-top:2px;font-weight:700}
.ing{position:relative;overflow:hidden;background:#fff3df;color:#3b1710;border-radius:12px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;box-shadow:0 3px 0 #b08a55}
.ing s{position:absolute;left:0;bottom:0;height:100%;width:0;background:#f5b82e88}.ing .ie{font-size:28px;position:relative;line-height:1.1}.ing .in{font-size:11px;font-weight:800;position:relative}
.ing.used{opacity:.4}.ing:active{transform:translateY(2px)}
#acts{display:flex;gap:8px}#acts .btn{flex:1;margin:0;padding:12px}
.fx{position:absolute;font-weight:900;font-size:20px;color:#ffe27a;text-shadow:0 2px 0 #000;pointer-events:none;animation:up 1.1s forwards;z-index:9;transform:translateX(-50%);white-space:nowrap}
@keyframes up{to{transform:translate(-50%,-60px);opacity:0}}
.fly{position:absolute;font-size:44px;pointer-events:none;z-index:9;transform:translate(-50%,-50%);transition:transform .55s ease-in,opacity .55s}
#ov,#set{position:absolute;inset:0;background:#000b;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;z-index:20}
#set{z-index:30}#ov.on,#set.on{display:flex}#ov .btn{width:220px}
.pn{background:#4d2016;border:2px solid #f5b82e66;border-radius:20px;padding:18px;width:min(86%,340px);display:flex;flex-direction:column;gap:12px}.pn h2{margin:0;text-align:center}
.pn label{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}.pn input[type=range]{flex:1;accent-color:#f5b82e}.pn .btn{margin:0}
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:6px}
.res h1{font-size:34px;margin:0;color:#f5b82e}.res .big{font-size:60px}.res .btn{width:240px}
.up{display:flex;align-items:center;gap:10px;background:#4d2016;border-radius:16px;padding:12px;border:2px solid #2aa5a055}.up .em2{font-size:34px}.up div{flex:1;text-align:left;font-size:13px}.up b{font-size:16px;display:block}.up .btn{margin:0;padding:8px 12px;font-size:15px}
</style></head><body>
<div id="app">
<section id="title" class="scr bg on"><h1>L'M3ALLEM</h1><h2>المعلم</h2><p>Marrakech Street Food 🇲🇦</p>

<div id="scene"><svg id="bg" viewBox="0 0 400 360" preserveAspectRatio="xMidYMid slice"></svg><div id="wks"></div><img id="chef" src="chef.png" alt=""><div id="say"></div><div id="custs"></div></div>
<div id="work"><div id="plateRow"><div id="pw"><div class="steam" id="steam"><i></i><i></i><i></i></div><div id="plate"></div></div><div id="pname"></div></div><div id="ings"></div>
<div id="acts"><button class="btn alt" id="bin">🗑️ Clear</button><button class="btn" id="serve">SERVE ✅</button></div></div>
<div id="ov"></div></section>
<section id="res" class="scr"></section>
<div id="set"><div class="pn"><h2>⚙ Settings</h2>
<label>🎵 Music <input type="range" id="vm" min="0" max="100"></label>
<label>🔊 Effects <input type="range" id="vs" min="0" max="100"></label>
<label>🗣️ Darija voices <input type="checkbox" id="vv"></label>
<button class="btn" data-go="setx">Done</button></div></div>
</div>

/* Pre-cached / Pre-recorded Darija Audio Clips & Sequential Voice Queue */
const AUDIO_CACHE = new Map();
let VOICE_QUEUE = [];
let IS_SPEAKING = false;
let ACTIVE_AUDIO = null;

function clearVoiceQueue(){
  VOICE_QUEUE = [];
  IS_SPEAKING = false;
  if(ACTIVE_AUDIO){
    try{ ACTIVE_AUDIO.pause(); ACTIVE_AUDIO.currentTime = 0; }catch(e){}
    ACTIVE_AUDIO = null;
  }
  try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){}
  document.querySelectorAll('.cust.talking').forEach(el => el.classList.remove('talking'));
}

/* Preload all Darija phrases as ready-to-play audio buffers/elements on startup */
function preloadDarijaVoices(){
  const allLines = Object.values(LN).flat();
  allLines.forEach(line => {
    const speakText = line[2] || line[1];
    if(!AUDIO_CACHE.has(speakText)){
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(speakText)}&tl=ar&client=tw-ob`;
      const aud = new Audio();
      aud.preload = 'auto';
      aud.src = url;
      AUDIO_CACHE.set(speakText, url);
    }
  });
}

function setTalkingVisual(custId, on){
  document.querySelectorAll('.cust.talking').forEach(el => el.classList.remove('talking'));
  if(on && custId){
    const el = document.querySelector(`.cust[data-id="${custId}"]`);
    if(el) el.classList.add('talking');
  }
}

function showSpeechBanner(face, l, fb){
  const e=$('say');
  e.classList.remove('on');
  void e.offsetWidth;
  const portraitHTML = face && (face.endsWith('.png') || face.endsWith('.jpg'))
    ? `<img src="${face}" alt="" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #f5b82e;flex:none" onerror="this.outerHTML='<b>${fb||'🧑🏽'}</b>'">`
    : `<b>${face||'👨🏽‍🍳'}</b>`;
  e.innerHTML=`${portraitHTML}<span>${l[0]}<small>${l[1]}</small></span>`;
  e.classList.add('on');
  if(G) G.sayT = 3.2;
}

function enqueueSpeech(item){
  // Deduplicate if same customer already queued for same category
  if(item.c && VOICE_QUEUE.some(q => q.c && q.c.id === item.c.id && q.kind === item.kind)) return;
  // Cap queue length at 3 so stale lines don't pile up infinitely
  if(VOICE_QUEUE.length >= 3) VOICE_QUEUE.shift();
  VOICE_QUEUE.push(item);
  processVoiceQueue();
}

function processVoiceQueue(){
  if(IS_SPEAKING || VOICE_QUEUE.length === 0) return;
  if(G && (G.paused || G.over)){
    VOICE_QUEUE = [];
    return;
  }

  const item = VOICE_QUEUE.shift();
  // Skip if customer already left the stall before their turn to speak (except 'sigh' goodbye)
  if(item.c && item.kind !== 'sigh' && G && !G.cust.some(x => x.id === item.c.id)){
    processVoiceQueue();
    return;
  }

  IS_SPEAKING = true;
  const {face, l, kind, c} = item;
  showSpeechBanner(face, l, c ? c.f.fb : '🧑🏽');

  if(c && kind){
    expr(kind, c.f.p);
    setTalkingVisual(c.id, true);
  }

  const finishTurn = () => {
    setTalkingVisual(null, false);
    ACTIVE_AUDIO = null;
    // Small natural pause (220ms) before the next customer speaks
    setTimeout(() => {
      IS_SPEAKING = false;
      processVoiceQueue();
    }, 220);
  };

  if(!S.set.voice || S.set.sfx <= 0){
    setTimeout(finishTurn, 1100);
    return;
  }

  const speakText = l[2] || l[1];
  const cachedUrl = AUDIO_CACHE.get(speakText) || `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(speakText)}&tl=ar&client=tw-ob`;

  let settled = false;
  const safeFinish = () => {
    if(settled) return;
    settled = true;
    finishTurn();
  };

  // Safety timeout so queue can never stall even if network/audio hangs
  const guardTimer = setTimeout(safeFinish, 3600);

  const runSpeechSynthesisFallback = () => {
    if(!window.speechSynthesis){
      clearTimeout(guardTimer);
      setTimeout(safeFinish, 1000);
      return;
    }
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(speakText);
      u.lang = 'ar-MA';
      u.pitch = c ? c.f.p : 1.0;
      u.rate = c ? (c.f.rate || 1.0) : 1.0;
      u.volume = Math.min(1, S.set.sfx);
      u.onend = () => { clearTimeout(guardTimer); safeFinish(); };
      u.onerror = () => { clearTimeout(guardTimer); safeFinish(); };
      speechSynthesis.speak(u);
    }catch(e){
      clearTimeout(guardTimer);
      safeFinish();
    }
  };

  try{
    const audio = new Audio(cachedUrl);
    ACTIVE_AUDIO = audio;
    audio.volume = Math.min(1, S.set.sfx);
    // Slight playback rate variation per customer persona for natural variety
    if(c && c.f.rate) audio.playbackRate = c.f.rate;
    audio.onended = () => { clearTimeout(guardTimer); safeFinish(); };
    audio.onerror = () => runSpeechSynthesisFallback();
    const playPromise = audio.play();
    if(playPromise !== undefined){
      playPromise.catch(() => runSpeechSynthesisFallback());
    }
  }catch(e){
    runSpeechSynthesisFallback();
  }
}

 e.style.left=(p.left-a.left+p.width/2)+'px';e.style.top=(p.top-a.top+p.height/2)+'px';$('app').appendChild(e);
 requestAnimationFrame(()=>{e.style.transform=`translate(calc(-50% + ${t.left-p.left+t.width/2-p.width/2}px),calc(-50% + ${t.top-p.top}px)) scale(.6) rotate(360deg)`;e.style.opacity=.2});setTimeout(()=>e.remove(),600)}
function chef(c){const e=$('chef');e.classList.remove('cheer','oops');void e.offsetWidth;e.classList.add(c)}
function mkCust(){const i=G.i,ri=i&&Math.random()<.4?i:Math.floor(Math.random()*(i+1)),r=R[ri],p=Math.min(.75,.25+.05*G.served+.02*i);
 const ex=r.x.filter(()=>Math.random()<p),rest=r.x.filter(k=>!ex.includes(k)),used=new Set(G.cust.map(x=>x.f.e)),avail=FA.filter(x=>!used.has(x.e)),f=rnd(avail.length?avail:FA);
 const c={id:++G.uid,f,ri,fresh:true,said:false,ord:{need:[...r.b,...ex],no:rest.length&&Math.random()<.5?rnd(rest):null,ex:ex.length}};
 c.maxP=(24+4*c.ord.need.length)*(1+.12*S.up.zel)*Math.max(.62,1-.03*i-.01*G.served);c.p=1;G.cust.push(c);if(!G.sel)G.sel=c.id;rCust();beep(700,.08);say(f.e,rnd(LN.g),'greet',c)}
const elOf=c=>document.querySelector(`.cust[data-id="${c.id}"]`);
function addIng(k){if(!G||G.paused||G.over)return;if(G.plate.includes(k)||k in G.cook){beep(160,.08,'square');return}
 beep(520,.05);if(ING[k][2])G.cook[k]=0;else{G.plate.push(k);rPlate()}}
function clearPlate(){G.plate=[];G.cook={};document.querySelectorAll('.ing s').forEach(s=>s.style.width=0);rPlate()}
function serve(){if(!G||G.paused||G.over)return;const c=G.cust.find(x=>x.id===G.sel);
 if(!c){fx('No customer yet!');return}if(!G.plate.length){fx('Plate is empty!');beep(160,.1,'square');return}
 const need=[...c.ord.need].sort().join(),have=[...G.plate].sort().join(),el=elOf(c);
 if(need===have){G.combo++;G.bestCombo=Math.max(G.bestCombo,G.combo);const price=R[c.ri].price+3*c.ord.ex;
  const tip=Math.round(price*.6*Math.max(0,c.p)*(1+.25*S.up.lamp))+(G.combo-1)*2;S.money+=price+tip;G.earned+=price+tip;G.tips+=tip;
  G.rep=Math.min(100,G.rep+(c.p>.5?5:2));G.served++;fly(c);fx('+'+(price+tip)+' DH'+(tip?' (tip '+tip+')':''),el);jingle([523,659,784]);chef('cheer');
  const em=el;setTimeout(()=>ghost(em,'gok'),450);
  say(c.f.e,rnd(LN.h),'happy',c);G.cust=G.cust.filter(x=>x!==c);G.sel=G.cust.length?G.cust[0].id:null}
 else{const m=c.ord.need.filter(k=>!G.plate.includes(k)),x=G.plate.filter(k=>!c.ord.need.includes(k));
  G.combo=0;G.rep-=5;c.p=Math.max(.06,c.p-.3);beep(150,.25,'sawtooth');fx('❌ Wrong!',el);chef('oops');
  say(c.f.e,x.includes('harissa')?rnd(LN.nh):m.includes('oil')?rnd(LN.fz):(m.includes('harissa')||m.includes('cumin'))?rnd(LN.zc):rnd(LN.a),'angry',c)}
 clearPlate();rCust();rHUD();
 if(G.served>=G.goal)end(true);else if(G.rep<=0)end(false)}
function end(win){G.over=true;clearVoiceQueue();const bonus=win?25*(G.i+1):0;if(win){S.money+=bonus;S.unl=Math.max(S.unl,Math.min(10,G.i+2))}
 S.best[G.i]=Math.max(S.best[G.i]||0,G.earned+bonus);sv();const st=Math.max(1,Math.ceil(G.rep/20));
 $('res').innerHTML=`<div class="res"><div class="big">${win?'🏆':'😞'}</div><h1>${win?"Tbarkellah a l'M3allem!":'Safi, the stall closed...'}</h1><div>${win?'تبارك الله عليك!':'الله يعوض'}</div>
 <div>${win?'⭐'.repeat(st)+'☆'.repeat(5-st):''}</div><div>Served ${G.served}/${G.goal} · Earned ${G.earned} DH (tips ${G.tips})<br>Best combo x${G.bestCombo}${win?' · Bonus +'+bonus+' DH':''}</div>
 ${win&&G.i<9?'<button class="btn" data-go="next">Next recipe ➜</button>':''}${win&&G.i===9?'<div style="font-size:20px">🎉 You are the famous M3allem of Marrakech! 🎉</div>':''}<button class="btn ${win&&G.i<9?'alt':''}" data-go="retry">↻ Play again</button><button class="btn alt" data-go="shop">🏮 Stall Shop</button><button class="btn alt" data-go="sel">☰ Levels</button></div>`;
 jingle(win?[523,659,784,1047]:[300,240,180],win?'triangle':'sawtooth');show('res')}
let last=0;
function tick(now){requestAnimationFrame(tick);const dt=Math.min(.1,(now-last)/1000);last=now;if(!G||G.paused||G.over)return;
 if(!IS_SPEAKING && G.sayT>0 && (G.sayT-=dt)<=0)$('say').classList.remove('on');
 if(G.cust.length<G.max){G.arr-=dt;if(G.arr<=0){mkCust();G.arr=2.5+Math.random()*2.5}}else G.arr=Math.max(G.arr,1.5);
 if(!G.cust.length)G.arr=Math.min(G.arr,1);
 for(const k in G.cook){G.cook[k]+=dt;const dur=ING[k][2]*(1-.22*S.up.fry),b=document.querySelector(`.ing[data-k="${k}"] s`);
  if(G.cook[k]>=dur){delete G.cook[k];G.plate.push(k);if(b)b.style.width=0;beep(660,.1);rPlate()}else if(b)b.style.width=(G.cook[k]/dur*100)+'%'}
 let left=false;for(const c of [...G.cust]){c.p-=dt/c.maxP;const el=elOf(c);
  if(c.p<=0){G.cust=G.cust.filter(x=>x!==c);if(G.sel===c.id)G.sel=G.cust.length?G.cust[0].id:null;G.combo=0;G.rep-=12;fx('😡 Left!',el);ghost(el,'gbad');beep(120,.4,'sawtooth');chef('oops');say(c.f.e,rnd(LN.to),'sigh',c);left=true;continue}
  if(!c.said&&c.p<.4){c.said=true;say(c.f.e,rnd(LN.i),'imp',c)}
  if(el){const n=c.p>.6?1:c.p>.4?2:c.p>.2?3:4;el.querySelector('.pb b').style.cssText=`width:${c.p*100}%;background:${c.p>.6?'#3fbf5f':c.p>.3?'#f5b82e':'#d62f2f'}`;
   el.querySelector('.mood').textContent=['😊','😐','😤','😡'][n-1];el.className=el.className.replace(/ m\d/,'')+' m'+n}}
 if(left){rCust();rHUD();if(G.rep<=0)end(false)}}
requestAnimationFrame(tick);
function pause(on){if(!G||G.over)return;G.paused=on;const o=$('ov');o.classList.toggle('on',on);if(on)clearVoiceQueue();
 if(on)o.innerHTML=`<h1>⏸ Paused</h1><button class="btn" data-go="resume">▶ Resume</button><button class="btn alt" data-go="set">⚙ Settings</button><button class="btn alt" data-go="retry">↻ Restart</button><button class="btn alt" data-go="sel">☰ Quit to levels</button>`}
function openSet(on){if(on){$('vm').value=S.set.music*100;$('vs').value=S.set.sfx*100;$('vv').checked=S.set.voice}else{sv();}$('set').classList.toggle('on',on)}
$('vm').oninput=e=>{S.set.music=e.target.value/100;vol()};$('vs').oninput=e=>{S.set.sfx=e.target.value/100;vol();beep(660,.08)};
$('vv').onchange=e=>{S.set.voice=e.target.checked;if(S.set.voice){clearVoiceQueue();enqueueSpeech({face:'cust_1.png',l:LN.h[0],kind:'happy',c:{id:0,f:FA[0]}})}};
$('app').addEventListener('click',e=>{ac();musicStart();const t=e.target.closest('[data-go],[data-lv],[data-up],.ing,.cust,#serve,#bin');if(!t)return;
 if(t.dataset.lv!==undefined){start(+t.dataset.lv);return}
 if(t.dataset.up){const k=t.dataset.up,u=UP.find(x=>x[0]===k),c=u[4][S.up[k]];if(S.up[k]<3&&S.money>=c){S.money-=c;S.up[k]++;sv();jingle([523,784]);rShop()}return}
 if(t.classList.contains('ing')){addIng(t.dataset.k);return}
 if(t.classList.contains('cust')){if(G&&!G.paused){G.sel=+t.dataset.id;document.querySelectorAll('.cust').forEach(c=>c.classList.toggle('sel',+c.dataset.id===G.sel));rPanel();beep(600,.04)}return}
 if(t.id==='serve'){serve();return}
 if(t.id==='bin'){if(G&&!G.paused&&!G.over){clearPlate();beep(250,.08)}return}
 const g=t.dataset.go;
 if(g==='set'){openSet(true);return}if(g==='setx'){openSet(false);return}
 if(g==='pause'){pause(true);return}if(g==='resume'){pause(false);return}
 if(g==='retry'){start(G.i);return}if(g==='next'){start(G.i+1);return}
 if(g==='sel'||g==='title'||g==='shop'){if(g==='sel'||g==='title'||g==='shop'){if(G){G.over=true;G=null;$('ov').classList.remove('on')}show(g)}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(G&&!G.over&&!G.paused)pause(true);try{AC&&AC.suspend()}catch(e){}}else try{AC&&AC.resume()}catch(e){}});
drawScene();
preloadDarijaVoices();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
